name: Probar creacion en Blogger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-insert:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probar posts.insert y borrar si funciona
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import sys
          import urllib.error
          from datetime import datetime, timezone

          sys.path.insert(0, "scripts")
          import publish_blogger as p

          blog_id = p.required_env("BLOGGER_BLOG_ID")
          token = p.get_access_token()
          title = "Prueba API Blogger - borrar"
          now = datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
          payload = p.post_payload(
              title,
              f"<p>Prueba corta para verificar permisos de creacion por API. {now}</p>",
              ["prueba-api"],
              published=now,
          )
          insert_url = f"{p.BLOGGER_API}/blogs/{blog_id}/posts/"
          created = None
          try:
              created = p.request_json(insert_url, method="POST", token=token, payload=payload)
              print("BLOGGER_INSERT_OK")
              print(f"created_id={created.get('id', '')}")
              print(f"created_url={created.get('url', '')}")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"BLOGGER_INSERT_FAILED_HTTP_{exc.code}")
              print(body[:1200])
              raise
          finally:
              post_id = created.get("id") if isinstance(created, dict) else ""
              if post_id:
                  delete_url = f"{p.BLOGGER_API}/blogs/{blog_id}/posts/{post_id}"
                  try:
                      p.request_json(delete_url, method="DELETE", token=token)
                      print("BLOGGER_TEST_POST_DELETED")
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")
                      print(f"BLOGGER_DELETE_FAILED_HTTP_{exc.code}")
                      print(body[:1200])
                      raise
          PY
