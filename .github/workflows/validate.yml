name: Validar generador

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar scripts
        run: python -m py_compile scripts/build.py scripts/publish_blogger.py scripts/publish_email.py scripts/publish_feature_email.py scripts/publish_feature_blogger.py scripts/setup_email.py scripts/setup_oauth.py scripts/setup_oauth_device.py scripts/validate.py scripts/doctor.py scripts/submit_indexnow.py scripts/generate_share_pack.py

      - name: Validar build de preview
        run: python scripts/validate.py

      - name: Validar payload IndexNow
        run: python scripts/submit_indexnow.py --dry-run
