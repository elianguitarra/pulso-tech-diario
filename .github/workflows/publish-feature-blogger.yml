name: Publicar nota especial en Blogger

on:
  workflow_dispatch:
    inputs:
      recreate:
        description: "Borrar la nota existente y publicarla de nuevo"
        required: false
        default: "false"

jobs:
  publish-feature:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar nota especial por Blogger API
        run: python scripts/publish_feature_blogger.py
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          RECREATE_FEATURE: ${{ inputs.recreate }}
